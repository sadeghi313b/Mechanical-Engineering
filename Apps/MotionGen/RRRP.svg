<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
 <rect width="1000" height="620" fill="#fff"/>
 <text x="500" y="56" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#17243a">RRRP four-bar mechanism</text>
 <text x="500" y="89" text-anchor="middle" font-family="Arial" font-size="19" fill="#526176">R = revolute (pin)    P = prismatic (slider)</text>
 <path d="M 140 455 H 860" stroke="#a7b4c5" stroke-width="20" stroke-linecap="round"/>
 <path d="M 570 280 H 880" stroke="#a7b4c5" stroke-width="15" stroke-linecap="round"/>
 <path d="M 570 360 H 880" stroke="#a7b4c5" stroke-width="15" stroke-linecap="round"/>
 <text x="805" y="265" font-family="Arial" font-size="20" fill="#526176">Ground rail</text>
 <path d="M 225 455 L 315 270" stroke="#3b82c4" stroke-width="31" stroke-linecap="round"/>
 <text x="145" y="312" font-family="Arial" font-size="20" fill="#2164a0">Crank (link 1)</text>
 <path d="M 315 270 L 665 320" stroke="#3fb27d" stroke-width="31" stroke-linecap="round"/>
 <text x="427" y="250" font-family="Arial" font-size="20" fill="#23875e">Connecting rod (link 2)</text>
 <rect x="625" y="285" width="100" height="70" rx="10" fill="#c454b5" stroke="#80327b" stroke-width="4"/>
 <text x="735" y="342" font-family="Arial" font-size="20" fill="#80327b">Slider (link 3)</text>
 <g fill="white" stroke="#27374f" stroke-width="6"><circle cx="225" cy="455" r="14"/><circle cx="315" cy="270" r="14"/><circle cx="665" cy="320" r="14"/></g>
 <text x="190" y="435" font-family="Arial" font-size="24" font-weight="bold" fill="#17243a">R</text>
 <text x="284" y="239" font-family="Arial" font-size="24" font-weight="bold" fill="#17243a">R</text>
 <text x="653" y="266" font-family="Arial" font-size="24" font-weight="bold" fill="#17243a">R</text>
 <text x="668" y="400" font-family="Arial" font-size="24" font-weight="bold" fill="#80327b">P</text>
 <text x="495" y="517" text-anchor="middle" font-family="Arial" font-size="22" fill="#526176">Ground link (link 4): fixed pivot and fixed rail</text>
 <rect x="95" y="550" width="810" height="47" rx="8" fill="#edf5fb"/>
 <text x="500" y="581" text-anchor="middle" font-family="Arial" font-size="19" fill="#334155">Joint sequence around the closed loop: R → R → R → P</text>
