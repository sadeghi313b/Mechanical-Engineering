 <path d="M 810 470 L 570 305" stroke="#fff9e9" stroke-width="15" stroke-linecap="round"/>
 <text x="722" y="294" font-family="Arial" font-size="21" fill="#aa6f1e">Slotted rocker (link 3)</text>
 <g transform="translate(570 305) rotate(34.5)">
  <rect x="-39" y="-29" width="78" height="58" rx="10" fill="#c454b5" stroke="#80327b" stroke-width="4"/>
  <path d="M -18 0 H 18" stroke="white" stroke-width="6"/>
 </g>
 <g fill="white" stroke="#27374f" stroke-width="6"><circle cx="190" cy="470" r="14"/><circle cx="275" cy="300" r="14"/><circle cx="810" cy="470" r="14"/></g>
 <text x="143" y="450" font-family="Arial" font-size="24" font-weight="bold" fill="#17243a">R</text>
 <text x="245" y="268" font-family="Arial" font-size="24" font-weight="bold" fill="#17243a">R</text>
 <text x="830" y="450" font-family="Arial" font-size="24" font-weight="bold" fill="#17243a">R</text>
 <text x="580" y="270" font-family="Arial" font-size="24" font-weight="bold" fill="#80327b">P</text>
 <path d="M 611 318 L 653 347" stroke="#80327b" stroke-width="3"/>
